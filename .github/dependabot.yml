version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    labels:
      - "dependencies"
    assignees:
      - "antonengelhardt"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "dependencies"
    assignees:
      - "antonengelhardt"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/docker"
    labels:
      - "dependencies"
    assignees:
      - "antonengelhardt"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
